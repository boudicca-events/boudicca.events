name: Deployment Prod

on: workflow_dispatch

permissions:
    contents: read
    packages: write

concurrency: prod

jobs:
    build-and-deploy:
        runs-on: ubuntu-latest
        environment: prod

        steps:
            -   uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
            -   name: Set up JDK 21
                uses: actions/setup-java@dd06d9cba3e5552c54d9f8ea23572deb30010f7c # v6.0.0
                with:
                    java-version: '21'
                    distribution: 'temurin'
            -   name: Setup Gradle
                uses: gradle/actions/setup-gradle@9c971963bec38e04b3d30dcc455b5382be2fdbfb # v6.3.0
            -   name: Execute Gradle build with tests
                run: ./gradlew build
            -   name: Build Docker images with gradle
                run: ./gradlew imageBuild
            -   name: Login to Docker Registry
                uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f
                with:
                    registry: 'ghcr.io'
                    username: ${{ github.actor }}
                    password: ${{ secrets.GITHUB_TOKEN }}
            -   name: Tag And Push Docker Images
                run: ./deploy_images.sh
            -   name: triggering deploy
                uses: appleboy/ssh-action@0ff4204d59e8e51228ff73bce53f80d53301dee2
                with:
                    host: ${{ secrets.SSH_HOST }}
                    username: ${{ secrets.SSH_USERNAME }}
                    key: ${{ secrets.SSH_KEY }}
                    port: ${{ secrets.SSH_PORT }}
                    script: ignored
