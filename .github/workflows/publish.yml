name: Publish Docker images

on: workflow_dispatch

permissions:
    contents: read

concurrency: publish

jobs:
    build-and-deploy:
        runs-on: ubuntu-latest
        environment: publish

        steps:
            -   uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
            -   name: Set up JDK 21
                uses: actions/setup-java@dd06d9cba3e5552c54d9f8ea23572deb30010f7c # v6.0.0
                with:
                    java-version: '21'
                    distribution: 'temurin'
            -   name: Setup Gradle
                uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1
            -   name: Execute Gradle build with tests
                run: ./gradlew build
            -   name: Build Docker images with gradle
                run: ./gradlew imageBuild
            -   name: Login to Docker Registry
                uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550
                with:
                    registry: 'docker.io'
                    username: ${{ secrets.DOCKERREGISTRY_USERNAME }}
                    password: ${{ secrets.DOCKERREGISTRY_TOKEN }}
            -   name: Tag And Push Docker Images
                run: ./publish_images.sh
